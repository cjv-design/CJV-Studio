name: CJV Windows Alpha

on:
  push:
    branches:
      - cjv/calibration-import
  workflow_dispatch:
    inputs:
      build_baseline:
        description: Also rebuild the pinned upstream Windows baseline
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  baseline:
    name: Unchanged Windows baseline
    # Validated once at 8387fc1; repeat when requested or changing the upstream pin.
    if: github.event_name == 'workflow_dispatch' && inputs.build_baseline
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8387fc12097a541093d796bf216c6e831f9ba5c0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: cjv-windows-alpha
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Record baseline type-check diagnostics
        shell: pwsh
        run: |
          npm run typecheck 2>&1 | Tee-Object -FilePath baseline-typecheck.txt
          "Baseline type-check exit code: $LASTEXITCODE" >> baseline-typecheck.txt
          exit 0
      - name: Build unchanged Windows application
        run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-baseline-diagnostics
          path: baseline-typecheck.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: unchanged-windows-baseline
          path: src-tauri/target/release/RapidRAW.exe
          if-no-files-found: error
          retention-days: 14

  alpha:
    name: Colour import tests and CJV Windows installer
    needs: baseline
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[portable-only]') && (needs.baseline.result == 'success' || needs.baseline.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: cjv-windows-alpha
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check importer formatting
        run: rustfmt --edition 2024 --check src-tauri/src/preset_converter.rs src-tauri/src/sony_white_balance.rs src-tauri/src/white_balance.rs src-tauri/src/camera_calibration.rs src-tauri/src/imported_curve.rs
      - name: Build the frontend for native tests
        run: npm run build
      - name: Test partial Calibration preset application
        run: node --experimental-strip-types --test tests/preset-calibration.test.mjs
      - name: Test preset white balance and amount
        run: node --test tests/preset-white-balance.test.mjs
      - name: Test imported curve strength
        run: node --experimental-strip-types --test tests/preset-imported-curve.test.mjs
      - name: Test the production XMP converter
        run: cargo test --locked --manifest-path tools/preset-converter-tests/Cargo.toml
      - name: Build local colour diagnostic helper
        run: cargo build --locked --manifest-path tools/preset-converter-tests/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: CJV-colour-diagnostics
          path: tools/preset-converter-tests/target/debug/cjv-preset-converter-tests.exe
          retention-days: 14
      - name: Build isolated CJV Windows installer
        run: npm run tauri -- build --config src-tauri/tauri.cjv.conf.json --bundles nsis
      - name: Record installer checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Get-FileHash -Algorithm SHA256 |
            Format-List | Out-File installer-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CJV-Studio-Alpha-0.1.2-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            installer-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Package the same built application for local verification
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          & 'C:\Program Files\7-Zip\7z.exe' x $installer[0].FullName '-oextracted' -y
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item -LiteralPath extracted/RapidRAW.exe -Destination portable/RapidRAW.exe
          Copy-Item -LiteralPath extracted/resources -Destination portable/resources -Recurse
          if (!(Test-Path portable/resources/onnxruntime.dll)) { throw 'Runtime resource missing' }
          @{ sourceCommit = '${{ github.sha }}'; installerSha256 = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash } |
            ConvertTo-Json | Set-Content portable/source-build.json
          Get-ChildItem portable -File -Recurse | Get-FileHash -Algorithm SHA256 |
            Select-Object Hash,Path | ConvertTo-Json | Set-Content portable/checksums.json
      - uses: actions/upload-artifact@v4
        with:
          name: CJV-Studio-Alpha-0.1.2-Portable
          path: portable
          if-no-files-found: error
          retention-days: 14
